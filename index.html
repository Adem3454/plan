nav .nt{position:absolute;left:50%;transform:translateX(-50%);opacity:0;transition:opacity .2s;font-size:15px;pointer-events:none;font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif}
.hero{position:relative;overflow:hidden}
.hero.sk-sabah{background:linear-gradient(160deg,#f0a04b,#4a86d8)}.hero.sk-gun{background:linear-gradient(160deg,#3d8de8,#7cc4f5)}.hero.sk-aksam{background:linear-gradient(160deg,#f0794f,#6a4fd8)}.hero.sk-gece{background:linear-gradient(160deg,#0b1d4a,#3a2a6b)}
.hero[class*=sk-] .rg::before{background:rgba(0,0,0,.3)}.hero>*{position:relative;z-index:1}
.hero.sk-gece::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,#fff 1px,transparent 1.6px),radial-gradient(circle,#fff 1.4px,transparent 2px);background-size:70px 50px,110px 80px;background-position:10px 8px,40px 30px;opacity:.55}
.hero.sk-sun::after{content:"";position:absolute;top:-40px;right:-30px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,236,150,.85),transparent 70%)}
.hero.sk-rain::before{content:"";position:absolute;inset:0;background-image:linear-gradient(105deg,transparent 48%,rgba(255,255,255,.4) 50%,transparent 52%);background-size:16px 44px;animation:rain .6s linear infinite;opacity:.5}@keyframes rain{to{background-position:-16px 44px}}
.hr{position:relative}.nowl{position:absolute;left:46px;right:0;height:2px;background:var(--bad);pointer-events:none;z-index:2}.nowl::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.gd{background:transparent!important;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center}.gd:empty::before{content:"·";color:var(--sep)}
.pc[data-cv]{background:color-mix(in srgb,var(--cv) 18%,var(--bg))}.stk{font-size:22px;margin-left:6px}
.sk{height:64px;border-radius:14px;margin-bottom:10px;background:linear-gradient(90deg,var(--card) 25%,color-mix(in srgb,var(--card) 82%,var(--l2)) 50%,var(--card) 75%);background-size:200% 100%;animation:shim 1.2s infinite}.sk.h{height:130px}@keyframes shim{to{background-position:-200% 0}}
