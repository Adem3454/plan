<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plan">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme:light)"><meta name="theme-color" content="#000" media="(prefers-color-scheme:dark)">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png">
<title>Plan</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--l:#000;--l2:#8e8e93;--sep:#c6c6c8;--ac:#007aff;--ok:#34c759;--warn:#ff9500;--bad:#ff3b30;--mat:rgba(249,249,249,.8);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--l:#fff;--sep:#38383a;--ac:#0a84ff;--mat:rgba(30,30,30,.8)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;touch-action:pan-x pan-y}
body{background:var(--bg);color:var(--l);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;overscroll-behavior:none}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
nav,#bar{background:var(--mat);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}
nav{position:sticky;top:0;z-index:5;margin:0 -16px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;display:flex;justify-content:space-between;align-items:center}
button{font:inherit;color:var(--ac);background:none;border:0;padding:6px 8px;cursor:pointer}
h1{font-size:34px;line-height:1.1;margin:8px 0 14px;letter-spacing:.3px}
h1 small{display:block;font-size:20px;font-weight:400}
h2{font-size:13px;font-weight:400;color:var(--l2);margin:18px 16px 6px}
small{color:var(--l2);font-size:13px}
.hint{color:var(--l2);text-align:center;font-size:14px}
.card{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:16px}
.card input{display:block;width:100%;border:0;border-top:.5px solid var(--sep);padding:13px 16px;font:inherit;background:var(--card);color:var(--l)}
.card input:first-child{border-top:0}
.row{display:block;width:100%;text-align:left;padding:13px 16px;border-top:.5px solid var(--sep)}
.row:first-child{border-top:0}
.red{color:var(--bad)}
.big{display:block;width:100%;background:var(--ac);color:#fff;border-radius:12px;padding:14px;font-weight:600}
.ctr{display:block;margin:12px auto}
.yr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mo{background:var(--card);border-radius:14px;padding:12px;cursor:pointer}
.mo b{display:block;margin-bottom:8px;font-size:15px}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dot{aspect-ratio:1;border-radius:50%;background:color-mix(in srgb,var(--ac) calc(var(--a)*100%),var(--sep))}
.dot.t{outline:2px solid var(--l);outline-offset:1px}
.wk,.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk span{text-align:center;color:var(--l2);font-size:12px;margin-bottom:4px}
.c{background:var(--card);border-radius:10px;min-height:62px;padding:5px 2px;text-align:center;cursor:pointer}
.c b{display:inline-block;min-width:26px;line-height:26px;border-radius:13px;font-weight:600}
.c.t b{background:var(--ac);color:#fff}
.c div{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;margin-top:2px}
u{width:6px;height:6px;border-radius:50%;background:var(--ac)}
u.w0{opacity:.45}u.w2{background:var(--warn)}u.d{opacity:.2}
.p{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:.5px solid var(--sep);cursor:pointer}
.p:first-child{border-top:0}
.tt{flex:1;min-width:0}.tt small{display:block}.tt s{color:var(--l2)}
.dn{width:44px;text-align:center}.dn small{display:block}.dn b{font-size:22px}.p.t .dn b{color:var(--ac)}
.m{width:56px;height:6px;border-radius:3px;background:var(--sep);overflow:hidden;flex:none}
.m i{display:block;height:100%;background:var(--ac)}.m.hot i{background:var(--warn)}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--l2);flex:none}
.done .ck{background:var(--ok);border-color:var(--ok)}
.done .tt{color:var(--l2);text-decoration:line-through}
.wt{color:var(--ac);font-size:8px;letter-spacing:1px}
.slid{opacity:.75}
.nw{display:flex;gap:16px;align-items:center;padding:16px}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
#qf{max-width:760px;margin:0 auto;display:flex;gap:8px}
#q{flex:1;border:0;border-radius:12px;padding:11px 14px;font:inherit;background:var(--card);color:var(--l);min-width:0}
#qf button{background:var(--ac);color:#fff;border-radius:12px;padding:0 16px;font-size:22px}
#sh{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.35);display:none}
#sh.o{display:block}
#sh>div{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:760px;background:var(--bg);border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translate(-50%,100%)}}
.seg{display:flex;background:rgba(120,120,128,.16);border-radius:9px;padding:2px;margin-bottom:16px}
.seg button{flex:1;border-radius:7px;color:var(--l);padding:6px}
.seg .on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
@media(prefers-reduced-motion:reduce){#sh>div{animation:none}}
</style></head><body>
<div id="app"></div>
<div id="bar"><form id="qf"><input id="q" placeholder="yarın 15:00 diş hekimi" enterkeyhint="done" autocomplete="off"><button aria-label="Ekle">+</button></form></div>
<div id="sh"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
</body></html>
